<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto | Tecnonauta</title>
<link rel="icon" href="/img/logo-tecnonauta.jpg">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div id="tn-header"></div>

<section class="seccion">
  <div class="container" id="detalleProducto">
    <p>Cargando producto...</p>
  </div>
</section>

<div id="tn-footer"></div>

<script src="/js/app.js"></script>
<script>
async function initProducto() {
  const slug = new URLSearchParams(location.search).get('slug');
  const productos = await TN.cargarProductos({});
  const p = productos.find(x => x.slug === slug) || productos[0];

  if (!p) {
    document.getElementById('detalleProducto').innerHTML = '<p>Producto no encontrado.</p>';
    return;
  }

  document.title = `${p.nombre} | Tecnonauta`;
  document.getElementById('detalleProducto').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start;">
      <div class="tarjeta-producto" style="box-shadow:none;">
        <div class="imagen" style="border-radius:var(--radio);">
          <img src="${p.imagen_url}" alt="${p.nombre}">
        </div>
      </div>
      <div>
        <span class="categoria" style="text-transform:uppercase;font-size:0.75rem;color:var(--gris-600);">${p.categoria || ''} ${p.marca ? '· ' + p.marca : ''} ${p.modelo ? '· ' + p.modelo : ''}</span>
        <h1 style="margin:8px 0;color:var(--violeta-900);">${p.nombre}</h1>
        ${p.calidad ? `<span class="badge" style="background:var(--violeta-500);">Calidad ${p.calidad}</span>` : ''}
        <p style="color:var(--gris-600);margin:18px 0;">${p.descripcion || ''}</p>
        <div style="font-size:2rem;font-weight:700;color:var(--violeta-700);">${TN.fmt(p.precio_minorista)}</div>
        <p style="font-size:0.8rem;color:var(--gris-600);margin-top:-8px;">Precio minorista, IVA incluido. Precio distribuidor: ${TN.fmt(p.precio_mayorista)}</p>
        <p style="font-size:0.85rem;">${p.stock > 0 ? `✅ Stock disponible (${p.stock} unidades)` : '❌ Sin stock'}</p>
        <button class="btn btn-primary" style="margin-top:14px;" data-id="${p.id}" onclick="agregarAlCarrito(${p.id}).then(()=>{this.textContent='¡Agregado! ✔'; setTimeout(()=>this.textContent='Agregar al carrito',1500)})">Agregar al carrito</button>
        <a href="/tienda.html" class="btn btn-outline" style="margin-top:14px;margin-left:10px;">← Volver a la tienda</a>
      </div>
    </div>
  `;
}
document.addEventListener('DOMContentLoaded', initProducto);
</script>
</body>
</html>
